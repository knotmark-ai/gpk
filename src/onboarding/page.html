<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
<title>GPK Setup</title>
<style>
/* Modern editorial craft: crisp surfaces, tactile switches, tabular monospace accents,
   Skill-to-MCP orchestration map, and GPK's coral-ruled workspace card. Zero network requests. */
:root, html[data-theme="light"] {
  --bg: #f4f5f2;
  --rail-bg: #eceee9;
  --surface: #ffffff;
  --surface-2: #f7f8f5;
  --surface-hover: #f0f2ee;
  --ink: #15201f;
  --muted: #5a6765;
  --faint: #879491;
  --line: rgba(21, 32, 31, 0.09);
  --line-strong: rgba(21, 32, 31, 0.18);
  --accent: #0e5f63;
  --accent-hover: #0a4c50;
  --accent-soft: rgba(14, 95, 99, 0.09);
  --on-accent: #f7fbfb;
  --coral: #c83e37;
  --ok: #1d7a46;
  --ok-soft: rgba(29, 122, 70, 0.11);
  --warn: #b05f11;
  --warn-soft: rgba(176, 95, 17, 0.12);
  --bad: #c2332a;
  --bad-soft: rgba(194, 51, 42, 0.10);
  --track: #cbd2cd;
  --knob: #ffffff;
  --shadow: 0 1px 2px rgba(16, 24, 22, 0.04), 0 6px 20px rgba(16, 24, 22, 0.03);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", "Noto Serif CJK SC", serif;
  --mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  html:not([data-theme="light"]) {
    --bg: #0c1012;
    --rail-bg: #101518;
    --surface: #151b1e;
    --surface-2: #101518;
    --surface-hover: #1b2327;
    --ink: #ecf1f0;
    --muted: #93a19f;
    --faint: #647270;
    --line: rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.16);
    --accent: #4cc9c0;
    --accent-hover: #62d4cc;
    --accent-soft: rgba(76, 201, 192, 0.13);
    --on-accent: #071918;
    --coral: #e3655b;
    --ok: #4cc38a;
    --ok-soft: rgba(76, 195, 138, 0.14);
    --warn: #f0a44c;
    --warn-soft: rgba(240, 164, 76, 0.15);
    --bad: #f26d65;
    --bad-soft: rgba(242, 109, 101, 0.14);
    --track: #344144;
    --knob: #f2f6f5;
    --shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 10px 28px rgba(0, 0, 0, 0.32);
    color-scheme: dark;
  }
}
html[data-theme="dark"] {
  --bg: #0c1012;
  --rail-bg: #101518;
  --surface: #151b1e;
  --surface-2: #101518;
  --surface-hover: #1b2327;
  --ink: #ecf1f0;
  --muted: #93a19f;
  --faint: #647270;
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.16);
  --accent: #4cc9c0;
  --accent-hover: #62d4cc;
  --accent-soft: rgba(76, 201, 192, 0.13);
  --on-accent: #071918;
  --coral: #e3655b;
  --ok: #4cc38a;
  --ok-soft: rgba(76, 195, 138, 0.14);
  --warn: #f0a44c;
  --warn-soft: rgba(240, 164, 76, 0.15);
  --bad: #f26d65;
  --bad-soft: rgba(242, 109, 101, 0.14);
  --track: #344144;
  --knob: #f2f6f5;
  --shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 10px 28px rgba(0, 0, 0, 0.32);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  color: var(--ink);
  font: 14.5px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* App Shell */
.shell {
  display: grid;
  grid-template-columns: 244px minmax(0, 1fr);
  min-height: 100vh;
}
.rail {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 24px 16px 18px;
  background: var(--rail-bg);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.brand-wrap {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 2px 8px;
}
.brand-logo { width: 34px; height: 34px; flex: none; border-radius: 8px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.14); }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand { font: 700 18px/1.1 var(--sans); letter-spacing: -0.02em; color: var(--ink); }
.brand-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

nav { display: grid; gap: 4px; }
nav a {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  text-decoration: none;
  padding: 9px 11px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  transition: background .14s ease, color .14s ease;
}
nav a:hover { background: var(--surface-hover); color: var(--ink); text-decoration: none; }
nav a[aria-current="page"] {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}
.nav-icon { width: 15px; height: 15px; flex: none; display: block; }
nav a .nav-icon { width: 16px; height: 16px; opacity: .88; }
nav a .nav-count {
  margin-left: auto;
  font: 500 11.5px/1.4 var(--mono);
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--muted);
}
nav a[aria-current="page"] .nav-count {
  background: var(--accent-soft);
  border-color: transparent;
  color: var(--accent);
}

.rail-footer {
  margin-top: auto;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.seg {
  display: inline-flex;
  padding: 2px;
  border-radius: 8px;
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.seg button {
  border: 0;
  background: transparent;
  color: var(--muted);
  font: 500 12px/1 var(--sans);
  padding: 5px 8px;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
}

/* Main Content */
main {
  width: 100%;
  max-width: 1080px;
  min-width: 0;
  margin: 0 auto;
  padding: 36px clamp(20px, 4vw, 52px) 80px;
}
.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
}
.page-head h1 {
  font: 650 26px/1.2 var(--sans);
  letter-spacing: -0.02em;
  margin: 0;
}
.page-sub {
  color: var(--muted);
  font-size: 14px;
  margin: 5px 0 0;
  max-width: 72ch;
}
.stack { display: grid; gap: 18px; }
.onboard-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 330px;
  gap: 22px;
  align-items: start;
}
@media (max-width: 960px) {
  .onboard-grid { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .shell { display: block; }
  .rail {
    position: static;
    height: auto;
    padding: 14px 16px;
    border-right: 0;
    border-bottom: 1px solid var(--line);
    gap: 12px;
  }
  .rail-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  nav { display: flex; flex-wrap: wrap; gap: 4px; }
  nav a { padding: 6px 10px; font-size: 13.5px; }
  nav a .nav-count { display: none; }
  .rail-footer { margin-top: 0; padding-top: 10px; }
  main { padding: 24px 16px 64px; }
}

/* Cards & Panels */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 22px 24px;
  box-shadow: var(--shadow);
}
.panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}
.panel h2 {
  font: 600 17px/1.3 var(--sans);
  letter-spacing: -0.01em;
  margin: 0;
}
.panel > p.intro, .panel-sub {
  color: var(--muted);
  font-size: 13.5px;
  margin: 4px 0 0;
  max-width: 70ch;
}
.group { margin-top: 20px; }
.group:first-child { margin-top: 0; }
.group > h3 {
  font: 600 13.5px/1.4 var(--sans);
  color: var(--ink);
  margin: 0 0 4px;
}
.group > p {
  color: var(--muted);
  font-size: 13.5px;
  margin: 0 0 12px;
}

/* KPI Stat Cards on Status Page */
.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
@media (max-width: 720px) { .stats { grid-template-columns: 1fr; } }
.stat {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 18px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.stat-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stat-label { font-size: 12.5px; font-weight: 500; color: var(--muted); }
.stat-value { font: 650 20px/1.2 var(--sans); letter-spacing: -0.015em; color: var(--ink); overflow-wrap: anywhere; }
.stat-meta { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* Badges & Code Chips */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border-radius: 999px;
  font: 500 12px/1.35 var(--sans);
  white-space: nowrap;
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.neutral { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }

.mono-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: 12.5px/1.4 var(--mono);
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--ink);
  word-break: break-all;
}

/* Key-Value Definition Rows */
.rows { margin: 0; border-top: 1px solid var(--line); }
.rows > div {
  display: grid;
  grid-template-columns: minmax(140px, 30%) minmax(0, 1fr);
  gap: 8px 16px;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding: 11px 0;
}
.rows > div:last-child { border-bottom: 0; padding-bottom: 2px; }
.rows dt { color: var(--muted); font-size: 13.5px; }
.rows dd { margin: 0; overflow-wrap: anywhere; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.muted { color: var(--muted); }

/* Selection Cards (Workspace Mode / Existing Workspace) */
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 540px) { .options { grid-template-columns: 1fr; } }
.option {
  position: relative;
  text-align: left;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 16px;
  color: var(--ink);
  font: inherit;
  cursor: pointer;
  transition: border-color .14s ease, background .14s ease;
}
.option:hover { border-color: var(--line-strong); background: var(--surface-hover); }
.option[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: var(--accent);
}
.option strong { display: block; font-size: 14.5px; font-weight: 600; }
.option span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.existing { display: grid; gap: 10px; }

/* Form Inputs */
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
@media (max-width: 600px) { .fields { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 13px; font-weight: 500; color: var(--ink); }
.field small { color: var(--muted); font-size: 12px; line-height: 1.45; }
.clash-slot { min-height: 0; }
.clash { display: block; color: var(--warn); font-size: 12.5px; margin-top: 3px; }
.clash.adopted { color: var(--ok); }
.clash button { padding: 0; margin-left: 5px; border: 0; background: none; color: var(--accent); font: inherit; text-decoration: underline; cursor: pointer; }

input:is([type=text],[type=url],[type=password],[type=search]), select, textarea {
  width: 100%;
  min-height: 38px;
  padding: 8px 11px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--surface-2);
  color: var(--ink);
  font: 14px/1.4 var(--sans);
  transition: border-color .14s ease, box-shadow .14s ease, background .14s ease;
}
input:is([type=text],[type=url],[type=password],[type=search]):focus, select:focus, textarea:focus {
  background: var(--surface);
  border-color: var(--accent);
  outline: none;
  box-shadow: 0 0 0 3px var(--accent-soft);
}
textarea { resize: vertical; min-height: 76px; }
.pw-wrap { position: relative; display: flex; align-items: center; }
.pw-wrap input { padding-right: 64px; }
.pw-toggle {
  position: absolute;
  right: 6px;
  border: 0;
  background: var(--surface);
  color: var(--muted);
  border-radius: 6px;
  padding: 4px 8px;
  font: 500 12px/1.2 var(--sans);
  cursor: pointer;
}
.pw-toggle:hover { color: var(--ink); }

/* Buttons */
.actions { margin-top: 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
button.primary {
  min-height: 38px;
  padding: 9px 18px;
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: var(--on-accent);
  font: 600 14px/1.2 var(--sans);
  white-space: nowrap;
  cursor: pointer;
  transition: background .14s ease, opacity .14s ease;
}
button.primary:hover:not(:disabled) { background: var(--accent-hover); }
button.primary:disabled { opacity: .55; cursor: progress; }

button.secondary, a.secondary {
  min-height: 34px;
  padding: 7px 13px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--surface-2);
  color: var(--ink);
  font: 500 13px/1.2 var(--sans);
  white-space: nowrap;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  transition: background .14s ease, border-color .14s ease;
}
button.secondary .nav-icon, a.secondary .nav-icon { width: 14px; height: 14px; }
button.secondary:hover:not(:disabled), a.secondary:hover {
  background: var(--surface-hover);
  border-color: var(--muted);
  text-decoration: none;
}
button.secondary:disabled { opacity: .5; cursor: not-allowed; }

.linkish {
  padding: 0;
  border: 0;
  background: none;
  color: var(--accent);
  font: 500 13.5px/1.4 var(--sans);
  cursor: pointer;
}
.linkish:hover { text-decoration: underline; }
.linkish.danger { color: var(--bad); }

/* Tactile Switches */
.switch {
  appearance: none;
  -webkit-appearance: none;
  flex: none;
  width: 42px;
  height: 24px;
  margin: 0;
  border-radius: 999px;
  background: var(--track);
  position: relative;
  cursor: pointer;
  border: 1px solid transparent;
}
.switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--knob);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .28);
}
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(18px); }
.switch:disabled { opacity: .55; cursor: not-allowed; }
@media (prefers-reduced-motion: no-preference) {
  .switch, .switch::after { transition: background .16s ease, transform .16s ease; }
}

.toggle-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 16px;
  border-radius: 10px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  cursor: pointer;
}
.toggle-banner.active {
  background: var(--accent-soft);
  border-color: var(--accent);
}
.toggle-banner-text strong { display: block; font-size: 14.5px; font-weight: 600; }
.toggle-banner-text span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }

details.fold { margin-top: 12px; }
details.fold.divider { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
details > summary {
  cursor: pointer;
  color: var(--accent);
  font-size: 13.5px;
  font-weight: 500;
  list-style: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸"; display: inline-block; width: 10px; transition: transform .14s ease; }
details[open] > summary::before { transform: rotate(90deg); }

/* Signature Catalog Preview Card */
.card {
  position: sticky;
  top: 24px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 3px solid var(--coral);
  border-radius: 6px 6px 12px 12px;
  padding: 18px 20px 16px;
  box-shadow: var(--shadow);
}
@media (max-width: 960px) { .card { position: static; } }
.card h2 { font: 600 16px/1.25 var(--serif); margin: 0; }
.card .who { font-size: 12.5px; color: var(--muted); margin: 3px 0 12px; }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree > li { border-bottom: 1px solid var(--line); }
.tree > li:last-child { border-bottom: 0; }
.tree ul { padding-left: 16px; }
.entry { display: grid; grid-template-columns: 14px 18px minmax(0, 1fr) auto; column-gap: 6px; align-items: baseline; padding: 8px 0; }
.entry .mark { font: 600 12px/1 var(--sans); color: var(--muted); }
.entry.built .mark { color: var(--ok); }
.entry.issue .mark { color: var(--bad); }
.entry .icon { width: 15px; height: 15px; flex: none; align-self: center; color: var(--accent); }
.entry .name { font: 600 14.5px/1.3 var(--sans); }
.entry .kind { font: 11.5px/1.3 var(--sans); color: var(--muted); white-space: nowrap; }
.entry .example { grid-column: 3 / 5; font-size: 12px; line-height: 1.45; color: var(--muted); margin-top: 2px; }
.tree li.home { background: var(--accent-soft); border-radius: 8px; margin: 4px -8px; padding: 2px 8px; border-bottom: 0; }
.tree li.templates .icon { color: var(--muted); }
.facts { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 12.5px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 500; }

/* Skill <-> MCP Visual Explorer */
.skills-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
@media (max-width: 900px) { .skills-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 580px) { .skills-grid { grid-template-columns: 1fr; } }

.skill-card {
  text-align: left;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 15px;
  color: var(--ink);
  font: inherit;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: border-color .14s ease, background .14s ease, transform .12s ease;
}
.skill-card:hover { border-color: var(--line-strong); background: var(--surface-hover); }
.skill-card[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
.skill-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.skill-id {
  font: 600 12.5px/1.35 var(--mono);
  color: var(--accent);
}
.skill-count {
  font: 500 11.5px/1.3 var(--mono);
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 1px 7px;
}
.skill-card-title { font: 600 14.5px/1.3 var(--sans); color: var(--ink); }
.skill-card-desc { font-size: 12.5px; line-height: 1.45; color: var(--muted); }

.skill-flow {
  margin-top: 14px;
  padding: 14px 16px;
  border-radius: 10px;
  background: var(--surface-2);
  border: 1px solid var(--accent);
  display: grid;
  gap: 10px;
}
.skill-flow-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.skill-flow-title { font: 600 13.5px/1.35 var(--sans); color: var(--ink); display: flex; align-items: center; gap: 8px; }
.flow-steps {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
@media (max-width: 780px) { .flow-steps { grid-template-columns: 1fr; } }
.flow-step {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.flow-step-num { font: 600 11.5px/1.2 var(--mono); color: var(--accent); text-transform: uppercase; letter-spacing: 0.03em; }
.flow-step-label { font: 600 13px/1.35 var(--sans); color: var(--ink); }
.flow-step-tools { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.flow-tool-chip {
  font: 11.5px/1.35 var(--mono);
  padding: 1px 6px;
  border-radius: 5px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--muted);
}

.tools-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.tools-search { flex: 1 1 240px; }

.tool-groups { display: grid; gap: 18px; }
.tool-group-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  padding: 0 2px;
}
.tool-group-title {
  font: 600 12px/1.3 var(--sans);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
}
.tool-list { display: grid; gap: 8px; }
.tool {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-2);
  padding: 12px 15px;
  transition: border-color .14s ease;
}
.tool:hover { border-color: var(--line-strong); }
.tool[open] { background: var(--surface); border-color: var(--line-strong); }
.tool > summary {
  display: grid;
  grid-template-columns: 12px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  width: 100%;
  color: var(--ink);
}
.tool > summary::before { color: var(--muted); }
.tool-summary-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tool-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tool-name { font: 600 13.5px/1.35 var(--mono); color: var(--ink); }
.tool-brief { font: 400 12.5px/1.4 var(--sans); color: var(--muted); }
.tool-summary-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

.skill-pill {
  font: 500 11.5px/1.3 var(--mono);
  padding: 2px 7px;
  border-radius: 6px;
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid transparent;
  cursor: pointer;
  white-space: nowrap;
}
.skill-pill.support {
  background: var(--surface);
  color: var(--muted);
  border-color: var(--line-strong);
}
.skill-pill:hover { border-color: var(--accent); color: var(--accent); }

.tool-body {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  display: grid;
  gap: 12px;
}
.tool-body-desc { margin: 0; font-size: 13px; line-height: 1.55; color: var(--muted); }
.tool-roles {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 12.5px;
  color: var(--muted);
}

.param-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.param-table th {
  text-align: left;
  font: 600 11.5px/1.3 var(--sans);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}
.param-table td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
.param-table tr:last-child td { border-bottom: 0; }
.param-key { font: 600 12.5px/1.4 var(--mono); color: var(--ink); white-space: nowrap; }
.param-req {
  display: inline-block;
  margin-left: 6px;
  font: 600 10.5px/1.2 var(--sans);
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--warn-soft);
  color: var(--warn);
}
.param-opt {
  display: inline-block;
  margin-left: 6px;
  font: 500 10.5px/1.2 var(--sans);
  color: var(--faint);
}
.param-type { font: 12px/1.45 var(--mono); color: var(--accent); word-break: break-word; }
.param-desc { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.param-sub { margin-top: 4px; font: 11.5px/1.45 var(--mono); color: var(--faint); }

.tool pre {
  margin: 8px 0 0;
  padding: 12px 14px;
  border-radius: 8px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  font: 12px/1.5 var(--mono);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--ink);
}

/* Notices & Toast Feedback */
.note { font-size: 13.5px; color: var(--muted); margin: 0; }
.note.bad { color: var(--bad); }
.note.ok { color: var(--ok); }
.notice {
  position: sticky;
  bottom: 16px;
  margin-top: 18px;
  padding: 11px 16px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
  font-weight: 500;
}
.notice.ok { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.notice.bad { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.aside-note { font-size: 13.5px; color: var(--muted); margin: 0 0 10px; }
</style>
</head>

function svgIcon(kind, cls = "nav-icon") {
  const ns = "http://www.w3.org/2000/svg";

  return svg;
}

function h(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === undefined || value === null || value === false) continue;
    if (key === "on") for (const [event, fn] of Object.entries(value)) node.addEventListener(event, fn);
    else if (key === "className" || key === "value" || key === "checked" || key === "disabled" || key === "selected") node[key] = value;
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat()) if (child !== null && child !== undefined && child !== false) node.append(child instanceof Node ? child : String(child));
  return node;
}

async function api(method, path, body) {

    const response = await fetch(path, { method, credentials: "same-origin", headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
    if (!response.ok) return { ok: false, error: { message: `HTTP ${response.status}.`, next: tr("Reopen the console with gpk open.", "请在终端重新运行 gpk open 打开新控制台。") } };
    return await response.json();
  } catch {
    return { ok: false, error: { message: tr("GPK service is unreachable.", "无法连接本地 GPK 服务。"), next: tr("Reopen the console with gpk open.", "请在终端运行 gpk open 重新打开控制台。") } };

}
const errorText = result => result.error ? `${result.error.message} ${result.error.next || ""}`.trim() : "";

// Workspace permissions are always enabled in full across all bound GPK containers.
function missingGrantSelections(proposal = [], granted = [], backendId = "") {
  const has = (root, scope, op) => granted.some(g => g.root.id === root && g.root.scope === scope && (!backendId || g.backendId === backendId) && g.operations.includes(op));
  return proposal
    .map(grant => ({
      root: grant.root.id,
      operations: grant.operations.filter(op => !has(grant.root.id, grant.root.scope, op)),
    }))
    .filter(entry => entry.operations.length > 0);
}

let syncingPermissions = false;
async function ensureFullPermissions(snapshot) {
  if (!snapshot || snapshot.settings !== "ready" || !Array.isArray(snapshot.proposal) || syncingPermissions) return false;
  const missing = missingGrantSelections(snapshot.proposal, snapshot.granted || [], snapshot.backend?.id || "");
  if (!missing.length) return false;
  syncingPermissions = true;
  const res = await api("POST", "/api/grants", { grants: missing });
  syncingPermissions = false;
  if (res.ok) {
    snapshot.granted = snapshot.proposal.map(g => ({ ...g }));
    snapshot.onboarding = "complete";
    snapshot.grants = snapshot.proposal.length;
    return true;
  }
  return false;
}

  const prevSpace = state?.connection?.space;

    api("GET", fullInspect ? "/api/state" : "/api/local"),
    serviceCache ? Promise.resolve({ ok: true, value: serviceCache }) : api("GET", "/api/service"),
  ]);
  inspectingLayout = false;
  if (svcRes.ok) serviceCache = svcRes.value;
  if (!stateRes.ok) { note = { kind: "bad", text: errorText(stateRes) }; render(); return; }
  state = stateRes.value;
  if (!fullInspect && prevLayout && !state.layout) state.layout = prevLayout;
  if (!fullInspect && prevSpace && state.connection && !state.connection.space) {
    state.connection.space = prevSpace;

// ---------- Skill <-> MCP Visual Explorer & Structured Parameter Inspector ----------
function summarizeSchemaType(prop) {
  if (!prop || typeof prop !== "object") return { type: "any", detail: "" };
  if (prop.const !== undefined) return { type: JSON.stringify(prop.const), detail: "" };
  if (Array.isArray(prop.enum)) return { type: prop.enum.map(v => JSON.stringify(v)).join(" | "), detail: "" };
  const variants = prop.anyOf || prop.oneOf;
  if (Array.isArray(variants)) {
    const parts = variants.map(v => summarizeSchemaType(v).type);
    return { type: [...new Set(parts)].join(" | "), detail: "" };
  }
  if (prop.type === "array") {
    const item = summarizeSchemaType(prop.items || {});
    const bounds = (prop.minItems !== undefined || prop.maxItems !== undefined)
      ? ` [${prop.minItems ?? 0}..${prop.maxItems ?? "∞"}]`
      : "";
    return { type: `array<${item.type}>${bounds}`, detail: item.detail };
  }
  if (prop.type === "object" && prop.properties) {
    const keys = Object.keys(prop.properties);
    const req = new Set(prop.required || []);
    if (keys.includes("scope") && keys.includes("id") && keys.includes("kind") && prop.properties.kind?.const) {
      return { type: `${prop.properties.kind.const}Ref`, detail: "{ scope, id, kind }" };
    }
    if (keys.includes("scope") && keys.includes("id") && keys.includes("kind")) {
      return { type: "EntityRef", detail: "{ scope, id, kind }" };
    }
    const shape = keys.map(k => `${k}${req.has(k) ? "" : "?"}`).join(", ");
    return { type: "object", detail: `{ ${shape} }` };
  }
  const base = Array.isArray(prop.type) ? prop.type.join(" | ") : (prop.type || "object");
  const fmt = prop.format ? ` (${prop.format})` : "";
  return { type: `${base}${fmt}`, detail: "" };
}

function extractSchemaParams(inputSchema) {
  const props = inputSchema?.properties || {};
  const required = new Set(inputSchema?.required || []);
  return Object.entries(props).map(([name, spec]) => {
    const { type, detail } = summarizeSchemaType(spec);
    return {
      name,
      required: required.has(name),
      type,
      detail,
      hint: bi(PARAM_HINTS[name]) || spec?.description || "",
    };
  });
}

function skillsTouchingTool(toolName) {
  const primary = SKILLS_CATALOG.filter(s => s.primary.includes(toolName));
  const support = SKILLS_CATALOG.filter(s => s.support.includes(toolName));
  return { primary, support };
}

  let activeFilter = "all";
  const search = h("input", { id: "tool-search", className: "tools-search", type: "search", autocorrect: "off", autocapitalize: "none", spellcheck: "false", placeholder: tr("Search tool name, parameter or Skill…", "搜索工具名称、参数或关联技能…"), "aria-label": tr("Search tools", "搜索工具") });

  const skillGridSlot = h("div", { className: "skills-grid" });
  const skillFlowSlot = h("div", {});
  const groupsSlot = h("div", { className: "tool-groups" });

  function selectSkill(skillId) {
    selectedSkill = selectedSkill === skillId ? null : skillId;
    renderExplorer();
  }

  function renderExplorer() {
    // 1. Render 6 Skill Cards
    skillGridSlot.replaceChildren(...SKILLS_CATALOG.map(skill => {
      const totalTools = new Set([...skill.primary, ...skill.support]).size;
      const isSelected = selectedSkill === skill.id;
      return h("button", {
        type: "button",
        className: "skill-card",
        "aria-pressed": isSelected ? "true" : "false",
        on: { click: () => selectSkill(skill.id) },
      },
        h("div", { className: "skill-card-top" },
          h("span", { className: "skill-id" }, skill.id),
          h("span", { className: "skill-count" }, `${totalTools} ${tr("tools", "个工具")}`)),
        h("div", { className: "skill-card-title" }, bi(skill.title)),
        h("div", { className: "skill-card-desc" }, bi(skill.desc)));
    }));

    // 2. Render Active Skill Orchestration Flow
    const activeSkillObj = SKILLS_CATALOG.find(s => s.id === selectedSkill);
    if (activeSkillObj) {
      skillFlowSlot.replaceChildren(
        h("div", { className: "skill-flow" },
          h("div", { className: "skill-flow-head" },
            h("div", { className: "skill-flow-title" },
              badge("accent", activeSkillObj.id, false),
              h("span", {}, bi(activeSkillObj.title) + " · " + tr("Tool Orchestration Pipeline", "工具编排链路"))),
            h("button", { type: "button", className: "linkish", on: { click: () => selectSkill(null) } },
              tr("Show all 28 tools ×", "显示全部 28 个工具 ×"))),
          h("div", { className: "flow-steps" },
            ...activeSkillObj.steps.map(step =>
              h("div", { className: "flow-step" },
                h("div", { className: "flow-step-label" }, bi(step.label)),
                h("div", { className: "flow-step-tools" }, ...step.tools.map(tn => h("span", { className: "flow-tool-chip" }, tn))))))));
    } else {
      skillFlowSlot.replaceChildren();
    }

    // 3. Filter Tools
    const q = search.value.trim().toLowerCase();
    const skillScopedTools = activeSkillObj
      ? tools.filter(t => activeSkillObj.primary.includes(t.name) || activeSkillObj.support.includes(t.name))
      : tools;
    const readCount = skillScopedTools.filter(tool => tool.annotations?.readOnlyHint).length;
    const writeCount = skillScopedTools.length - readCount;

    filterGroup.replaceChildren(...[
      ["all", `${tr("All", "全部")} (${skillScopedTools.length})`],
      ["read", `${tr("Read", "只读")} (${readCount})`],
      ["write", `${tr("Write", "写入")} (${writeCount})`],
    ].map(([val, label]) => h("button", { type: "button", "aria-pressed": activeFilter === val ? "true" : "false", on: { click: () => { activeFilter = val; renderExplorer(); } } }, label)));

    const matching = skillScopedTools.filter(tool => {
      const ro = Boolean(tool.annotations?.readOnlyHint);
      if (activeFilter === "read" && !ro) return false;
      if (activeFilter === "write" && ro) return false;
      if (!q) return true;
      const brief = bi(TOOL_BRIEFS[tool.name]) || "";
      const paramNames = Object.keys(tool.inputSchema?.properties || {}).join(" ");
      const skillsText = [...skillsTouchingTool(tool.name).primary, ...skillsTouchingTool(tool.name).support].map(s => s.id).join(" ");
      return `${tool.name} ${brief} ${tool.description || ""} ${paramNames} ${skillsText}`.toLowerCase().includes(q);
    });

    if (!matching.length) {
      groupsSlot.replaceChildren(h("p", { className: "muted", style: "padding:12px 2px" }, tr("No matching MCP tools.", "没有匹配的 MCP 工具。")));
      return;
    }

    const byName = new Map(matching.map(tool => [tool.name, tool]));
    const renderedNames = new Set();
    const sections = [];

    for (const group of TOOL_GROUPS) {
      const groupTools = group.tools.map(n => byName.get(n)).filter(Boolean);
      if (!groupTools.length) continue;
      groupTools.forEach(t => renderedNames.add(t.name));
      sections.push(renderToolGroup(bi(group.title), groupTools));
    }
    const uncategorized = matching.filter(t => !renderedNames.has(t.name));
    if (uncategorized.length) sections.push(renderToolGroup(tr("Other Tools", "其他工具"), uncategorized));
    groupsSlot.replaceChildren(...sections);
  }

  function renderToolGroup(groupTitle, groupTools) {
    return h("div", {},
      h("div", { className: "tool-group-head" },
        h("span", { className: "tool-group-title" }, groupTitle),
        h("span", { className: "muted", style: "font-size:12px" }, `${groupTools.length}`)),
      h("div", { className: "tool-list" }, ...groupTools.map(renderToolCard)));
  }

  function renderToolCard(tool) {
    const ro = Boolean(tool.annotations?.readOnlyHint);
    const { primary, support } = skillsTouchingTool(tool.name);
    const params = extractSchemaParams(tool.inputSchema);
    const brief = bi(TOOL_BRIEFS[tool.name]) || tool.description || "";

    const skillPills = [
      ...primary.map(s => h("button", {
        type: "button",
        className: "skill-pill",
        title: tr("Core tool in ", "核心调用技能：") + s.id,
        on: { click: event => { event.preventDefault(); event.stopPropagation(); selectSkill(s.id); } },
      }, s.id)),
      ...support.slice(0, 2).map(s => h("button", {
        type: "button",
        className: "skill-pill support",
        title: tr("Supporting tool in ", "协同调用技能：") + s.id,
        on: { click: event => { event.preventDefault(); event.stopPropagation(); selectSkill(s.id); } },
      }, s.id)),
    ];

    return h("details", { className: "tool" },
      h("summary", {},
        h("div", { className: "tool-summary-main" },
          h("div", { className: "tool-name-row" }, h("span", { className: "tool-name" }, tool.name)),
          h("span", { className: "tool-brief" }, brief)),
        h("div", { className: "tool-summary-tags" },
          ...skillPills,
          badge(ro ? "neutral" : "warn", ro ? tr("Read", "只读") : tr("Write", "写入"), false))),
      h("div", { className: "tool-body" },
        h("p", { className: "tool-body-desc" }, tool.description || ""),
        (primary.length || support.length)
          ? h("div", { className: "tool-roles" },
              primary.length ? h("span", {}, h("strong", {}, tr("Core Skills: ", "核心编排技能：")), ...primary.map(s => h("button", { type: "button", className: "skill-pill", style: "margin-right:5px", on: { click: () => selectSkill(s.id) } }, s.id))) : null,
              support.length ? h("span", {}, h("strong", {}, tr("Supporting Skills: ", "按需协同技能：")), ...support.map(s => h("button", { type: "button", className: "skill-pill support", style: "margin-right:5px", on: { click: () => selectSkill(s.id) } }, s.id))) : null)
          : null,
        params.length
          ? h("table", { className: "param-table" },
              h("thead", {}, h("tr", {},
                h("th", {}, tr("Parameter", "参数名称")),
                h("th", {}, tr("Type & Values", "类型与约束")),
                h("th", {}, tr("Description", "参数说明")))),
              h("tbody", {}, ...params.map(p =>
                h("tr", {},
                  h("td", {},
                    h("span", { className: "param-key" }, p.name),
                    p.required
                      ? h("span", { className: "param-req" }, tr("Required", "必填"))
                      : h("span", { className: "param-opt" }, tr("Optional", "可选"))),
                  h("td", {},
                    h("div", { className: "param-type" }, p.type),
                    p.detail ? h("div", { className: "param-sub" }, p.detail) : null),
                  h("td", { className: "param-desc" }, p.hint || "—")))))
          : h("p", { className: "muted" }, tr("This tool takes an empty object {}.", "该工具无需传入必填参数（传空对象 {} 即可）。")),
        h("details", { className: "fold" },
          h("summary", {}, tr("View raw JSON Schema", "查看原始 JSON Schema")),
          h("pre", {}, JSON.stringify(tool.inputSchema, null, 2)))));
  }

  search.addEventListener("input", renderExplorer);
  renderExplorer();

  return h("div", { className: "stack" },
    panel(
      h("div", { className: "panel-head" },
        h("div", {},
          h("h2", {}, tr("Workflow Skills ↔ MCP Orchestration", "六大技能与 MCP 工具编排关系")),
          h("p", { className: "panel-sub" }, tr("Click any Skill card to inspect its workflow pipeline and filter the MCP tools it calls.", "点击任意 Skill 卡片，即可展开该技能的调用链路并筛选对应的 MCP 工具。"))),
        badge("neutral", `${SKILLS_CATALOG.length} Skills · ${tools.length} Tools`, false)),
      skillGridSlot,

    panel(

      groupsSlot));

        h("div", { className: "stat-top" }, h("span", { className: "stat-label" }, tr("Craft workspace", "Craft 空间")), craftBadge),
        h("div", { className: "stat-value", id: "status-craft-name" }, spaceLabel),
        h("div", { className: "stat-meta" }, lv.onboarding === "complete" ? tr("Workspace ready · full access", "工作区已就绪 · 读写权限已全开") : tr("Setup required", "待完成初始化"))),
      h("div", { className: "stat" },
        h("div", { className: "stat-top" }, h("span", { className: "stat-label" }, tr("MCP & Skills", "MCP 与技能")),
          h("a", { href: "/tools", className: "badge accent", on: { click: e => { e.preventDefault(); navigateTo("/tools"); } } }, `6 Skills · ${sv.tools.length} Tools`)),
        h("div", { className: "stat-meta", style: "margin-top:auto" }, h("span", { className: "mono-chip" }, sv.endpoint), copyBtn)),
    ));
  } else if (!service.ok) {
    blocks.push(panel(h("p", { role: "alert", className: "note bad" }, errorText(service))));
  }

  if (local.ok) {
    const value = local.value;
    const detailRows = [
      [tr("Control folder", "本地控制目录"), h("span", { className: "mono-chip" }, value.controlRoot)],
      [tr("Onboarding", "初始化状态"), value.onboarding === "complete" ? badge("ok", tr("Complete", "已完成")) : badge("warn", tr("Required", "待完成"))],
    ];
    if (value.settings === "ready") {
      detailRows.push([
        tr("Workspace permissions", "工作区读写权限"),
        value.onboarding === "complete"
          ? badge("ok", tr("All enabled", "全部已开启"))
          : badge("warn", tr("Syncing…", "同步权限中…")),
      ]);
      const autoIngest = value.ingestion;
      detailRows.push([
        tr("Automatic session retention", "会话自动沉淀"),
        autoIngest?.enabled
          ? badge("ok", tr("Enabled", "已开启"))
          : badge("neutral", tr("Off", "未开启"), false),
        h("button", { type: "button", className: "linkish", on: { click: () => navigateTo("/config") } }, tr("Configure →", "前往配置 →")),
      ]);
    }
    blocks.push(panel(
      h("div", { className: "panel-head" },
        h("div", {}, h("h2", {}, tr("Instance overview", "实例与配置概览")), h("p", { className: "panel-sub" }, tr("Shared by Claude Code, Codex and Antigravity pointing at this control folder.", "指向该控制目录的 Claude Code、Codex 与 Antigravity 共享同一套工作区与配置。"))),
        h("button", { type: "button", className: "secondary", on: { click: () => navigateTo("/config") } }, tr("Open Configuration", "打开配置"))),
      rows(detailRows),
    ));
    if (value.connection?.tokens === "stored") void verifyCraftInBackground();
  } else {
    blocks.push(panel(h("p", { role: "alert", className: "note bad" }, errorText(local))));
  }

  app.replaceChildren(h("div", { className: "stack" }, ...blocks));
}

function startConsole() {
  applyTheme();
  if (typeof window !== "undefined") {
    window.addEventListener("popstate", () => {
      currentPath = normalizePath(location.pathname);
      note = null;
      rerenderCurrent();
    });
  }
  renderChrome();
  if (currentPath === "/console" || currentPath === "/tools") loadServiceView();
  else refresh();
}

startConsole();
</script>
</body>
</html>
