<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
<title>GPK Setup</title>
<style>
:root { --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc; --accent: #2f5bd3; --accent-text: #ffffff; --ok: #1f7a45; --warn: #a15c00; --bad: #b42318; }
@media (prefers-color-scheme: dark) { :root { --bg: #161615; --card: #1f1f1d; --text: #ececea; --muted: #a3a39d; --line: #33332f; --accent: #6d8ff0; --accent-text: #0e0e0d; --ok: #5cc28a; --warn: #e0a24a; --bad: #f0796e; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 24px; }
.steps { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.step { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.step.on { border-color: var(--accent); color: var(--accent); }
.step.done { color: var(--ok); border-color: var(--ok); }
section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
h2 { font-size: 17px; margin: 0 0 12px; }
label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
input[type=text], select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
.choice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; cursor: pointer; color: var(--text); font-size: 15px; }
.choice input { margin-top: 4px; }
.hint { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
button { margin-top: 16px; padding: 9px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
.grant { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
.grant h3 { font-size: 14px; margin: 0 0 6px; display: flex; justify-content: space-between; gap: 8px; }
.ops { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.ops label { display: flex; gap: 6px; align-items: center; margin: 0; color: var(--text); font-size: 13px; font-family: ui-monospace, Menlo, monospace; }
.badge { font-size: 12px; font-weight: 500; color: var(--ok); }
.msg { margin-top: 12px; font-size: 14px; }
.msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); } .msg.warn { color: var(--warn); }
ul.plain { margin: 8px 0 0; padding-left: 18px; }
code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
</style>
</head>
<body>
<main id="app"><p>Loading…</p></main>
<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const TEXT = {
  en: {
    title: "Set up GPK", sub: "Connect Craft, create the GPK structure and choose what GPK may change. Everything here ends up in your local settings.json and grants.json.",
    s1: "Connect Craft", s2: "Workspace", s3: "Permissions", s4: "Done",
    connectTitle: "Connect Craft", connectText: "GPK uses its own Craft connection. Craft will ask you to choose a workspace and approve GPK.",
    connect: "Connect Craft", waiting: "Waiting for Craft approval…", authFailed: "Authorization did not complete:",
    connected: "Connected to", wsTitle: "Workspace and languages",
    existing: "This workspace has", folders: "top-level folder(s)", collections: "Collection(s)",
    dedicated: "Dedicated to GPK", dedicatedHint: "Everything is created at the top level of the workspace.",
    shared: "Shared with other notes", sharedHint: "Everything GPK creates goes into one folder, and nothing you already have is touched.",
    working: "Working language", workingHint: "Conversation and the content GPK writes into records.",
    metadata: "Metadata language", metadataHint: "Folder, Collection and view names and template headings. Columns, states and GPK tags always stay English.",
    timezone: "Timezone", timezoneHint: "Leave empty to use the workspace timezone",
    names: "Names", host: "Host document", areas: "Areas Collection", projects: "Projects Collection", sources: "Sources folder", wikis: "Wikis folder", outputs: "Outputs folder",
    create: "Create the structure", creating: "Creating…",
    grantsTitle: "What GPK may change", grantsText: "Each group is one place in your workspace. Untick anything you do not want GPK to do. Deleting, archiving and restoring are never offered here.",
    granted: "granted", grant: "Grant selected", granting: "Saving…",
    doneTitle: "GPK is ready", doneText: "Return to your conversation; the Agent can now work in your workspace.",
    locations: "Locations", save: "Save preferences", saved: "Saved.",
    roles: { "daily-notes": "Daily Notes", inbox: "Inbox", system: "GPK System page (checkpoints)", area: "Areas", project: "Projects", source: "Sources", wiki: "Wikis", output: "Outputs" },
  },
  "zh-CN": {
    title: "设置 GPK", sub: "连接 Craft、创建 GPK 结构，并选择 GPK 可以修改哪些内容。这里的一切最终写入本地的 settings.json 和 grants.json。",
    s1: "连接 Craft", s2: "工作区", s3: "权限", s4: "完成",
    connectTitle: "连接 Craft", connectText: "GPK 使用自己的 Craft 连接。Craft 会请你选择一个工作区并批准 GPK。",
    connect: "连接 Craft", waiting: "等待 Craft 批准…", authFailed: "授权未完成：",
    connected: "已连接到", wsTitle: "工作区与语言",
    existing: "这个工作区现有", folders: "个顶层文件夹", collections: "个 Collection",
    dedicated: "专用于 GPK", dedicatedHint: "所有结构直接建在工作区顶层。",
    shared: "与其他笔记共用", sharedHint: "GPK 创建的内容都放进一个文件夹，不动你已有的任何内容。",
    working: "工作语言", workingHint: "对话以及 GPK 写入记录的内容。",
    metadata: "元数据语言", metadataHint: "文件夹、Collection、视图名称和模板标题。列名、状态值和 GPK 标签始终保持英文。",
    timezone: "时区", timezoneHint: "留空则使用工作区时区",
    names: "名称", host: "宿主文档", areas: "Areas Collection", projects: "Projects Collection", sources: "Sources 文件夹", wikis: "Wikis 文件夹", outputs: "Outputs 文件夹",
    create: "创建结构", creating: "创建中…",
    grantsTitle: "GPK 可以修改什么", grantsText: "每一组对应工作区里的一个位置。不希望 GPK 做的操作就取消勾选。删除、归档和恢复不会在这里提供。",
    granted: "已授予", grant: "授予所选权限", granting: "保存中…",
    doneTitle: "GPK 已就绪", doneText: "回到对话即可，Agent 现在可以在你的工作区里工作了。",
    locations: "位置", save: "保存偏好", saved: "已保存。",
    roles: { "daily-notes": "Daily Notes", inbox: "Inbox", system: "GPK System 页面（检查点）", area: "Areas", project: "Projects", source: "Sources", wiki: "Wikis", output: "Outputs" },
  },
};
const DEFAULT_NAMES = {
  en: { host: "GPK", areas: "Areas", projects: "Projects", sources: "Sources", wikis: "Wikis", outputs: "Outputs" },
  "zh-CN": { host: "GPK", areas: "领域", projects: "项目", sources: "来源", wikis: "知识", outputs: "产出" },
};
let lang = navigator.language && navigator.language.toLowerCase().startsWith("zh") ? "zh-CN" : "en";
let state = null;
let busy = false;
let message = null;
let form = null;
let namesEdited = false;
let polling = null;

const t = key => TEXT[lang][key];
function h(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (key === "on") for (const [event, fn] of Object.entries(value)) node.addEventListener(event, fn);
    else if (key in node) node[key] = value;
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) if (child !== null && child !== undefined && child !== false) node.append(child instanceof Node ? child : String(child));
  return node;
}

async function api(method, path, body) {
  const response = await fetch(path, {
    method, headers: { "x-gpk-token": TOKEN, ...(body ? { "content-type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!response.ok) return { ok: false, error: { message: `HTTP ${response.status}`, next: "Ask the Agent to open GPK setup again." } };
  return response.json();
}
function errorText(result) { return result.error ? `${result.error.message} ${result.error.next || ""}`.trim() : "Unknown error."; }

async function refresh() {
  const result = await api("GET", "/api/state");
  if (!result.ok) { message = { kind: "bad", text: errorText(result) }; render(); return; }
  state = result.value;
  if (state.preferences && TEXT[state.preferences.workingLanguage]) lang = state.preferences.workingLanguage;
  if (!form) {
    const metadataLanguage = lang;
    form = {
      workspace: dedicatedGuess() ? "dedicated" : "shared",
      workingLanguage: lang, metadataLanguage, timezone: "",
      names: { ...DEFAULT_NAMES[metadataLanguage] },
    };
  }
  const connection = state.connection || {};
  const authorizing = connection.pendingAuthorizationUrl && connection.tokens !== "verified";
  if (authorizing && !polling) polling = setInterval(refresh, 2000);
  if (!authorizing && polling) { clearInterval(polling); polling = null; }
  render();
}

function dedicatedGuess() {
  const candidates = (state && state.layout && state.layout.candidates) || { folders: [], collections: [] };
  const top = candidates.folders.filter(folder => folder.parentId === null && folder.name !== "How to use Craft");
  return top.length === 0 && candidates.collections.length === 0;
}

function stage() {
  if (!state) return 0;
  if ((state.connection || {}).tokens !== "verified") return 1;
  if (state.settings !== "ready") return 2;
  if (state.onboarding !== "complete") return 3;
  return 4;
}

function render() {
  const app = document.getElementById("app");
  document.documentElement.lang = lang;
  const current = stage();
  const steps = h("div", { className: "steps" }, ["s1", "s2", "s3", "s4"].map((key, index) =>
    h("span", { className: `step${index + 1 === current ? " on" : index + 1 < current ? " done" : ""}` }, `${index + 1}. ${t(key)}`)));
  const body = current === 1 ? connectCard() : current === 2 ? workspaceCard() : current === 3 ? grantsCard() : current === 4 ? doneCard() : h("p", {}, "…");
  app.replaceChildren(...[h("h1", {}, t("title")), h("p", { className: "sub" }, t("sub")), steps, body,
    message ? h("p", { className: `msg ${message.kind}` }, message.text) : null].filter(Boolean));
}

function connectCard() {
  const connection = state.connection || {};
  const pending = connection.pendingAuthorizationUrl;
  return h("section", {},
    h("h2", {}, t("connectTitle")), h("p", {}, t("connectText")),
    connection.authorizationError ? h("p", { className: "msg bad" }, `${t("authFailed")} ${connection.authorizationError}`) : null,
    pending ? h("p", { className: "msg warn" }, t("waiting"), " ", h("a", { href: pending }, "↗")) : null,
    h("button", { disabled: busy, on: { click: async () => {
      busy = true; message = null; render();
      const result = await api("POST", "/api/authorize", {});
      busy = false;
      if (!result.ok) { message = { kind: "bad", text: errorText(result) }; render(); return; }
      if (result.value.authorizationUrl) { location.href = result.value.authorizationUrl; return; }
      refresh();
    } } }, t("connect")));
}

function field(key, label) {
  return h("div", {}, h("label", { htmlFor: `n-${key}` }, label),
    h("input", { type: "text", id: `n-${key}`, value: form.names[key], maxLength: 80, on: { input: event => { form.names[key] = event.target.value; namesEdited = true; } } }));
}

function workspaceCard() {
  const candidates = state.layout ? state.layout.candidates : { folders: [], collections: [] };
  const space = state.connection.space || {};
  const radio = (value, title, hint) => h("label", { className: "choice" },
    h("input", { type: "radio", name: "workspace", checked: form.workspace === value, on: { change: () => { form.workspace = value; } } }),
    h("span", {}, h("strong", {}, title), h("p", { className: "hint" }, hint)));
  const languageSelect = (key, onChange) => h("select", { id: key, on: { change: event => { form[key] = event.target.value; onChange && onChange(); render(); } } },
    [["en", "English"], ["zh-CN", "中文"]].map(([value, label]) => h("option", { value, selected: form[key] === value }, label)));
  return h("section", {},
    h("h2", {}, t("wsTitle")),
    h("p", {}, `${t("connected")} `, h("strong", {}, space.name || "?"), `. ${t("existing")} ${candidates.folders.filter(f => f.parentId === null).length} ${t("folders")}, ${candidates.collections.length} ${t("collections")}.`),
    radio("dedicated", t("dedicated"), t("dedicatedHint")),
    radio("shared", t("shared"), t("sharedHint")),
    h("div", { className: "grid" },
      h("div", {}, h("label", { htmlFor: "workingLanguage" }, t("working")), languageSelect("workingLanguage", () => { lang = form.workingLanguage; }), h("p", { className: "hint" }, t("workingHint"))),
      h("div", {}, h("label", { htmlFor: "metadataLanguage" }, t("metadata")), languageSelect("metadataLanguage", () => { if (!namesEdited) form.names = { ...DEFAULT_NAMES[form.metadataLanguage] }; }), h("p", { className: "hint" }, t("metadataHint")))),
    h("label", { htmlFor: "timezone" }, t("timezone")),
    h("input", { type: "text", id: "timezone", value: form.timezone, placeholder: `${space.timezone || ""} — ${t("timezoneHint")}`, on: { input: event => { form.timezone = event.target.value; } } }),
    h("label", {}, t("names")),
    h("div", { className: "grid" }, field("host", t("host")), field("areas", t("areas")), field("projects", t("projects")), field("sources", t("sources")), field("wikis", t("wikis")), field("outputs", t("outputs"))),
    h("button", { disabled: busy, on: { click: async () => {
      busy = true; message = { kind: "warn", text: t("creating") }; render();
      const result = await api("POST", "/api/establish", { ...form, timezone: form.timezone.trim() || null });
      busy = false;
      message = result.ok ? null : { kind: "bad", text: errorText(result) };
      refresh();
    } } }, t("create")));
}

function roleOf(rootId) {
  if (TEXT[lang].roles[rootId]) return TEXT[lang].roles[rootId];
  const location = ((state.layout || {}).locations || []).find(entry => entry.ref.id === rootId);
  return location ? TEXT[lang].roles[location.role] : rootId;
}

function grantsCard() {
  const proposal = state.proposal || [];
  const granted = state.granted || [];
  const selected = new Map(proposal.map(grant => [grant.root.id, new Set(grant.operations)]));
  const has = (rootId, op) => granted.some(grant => grant.root.id === rootId && grant.operations.includes(op));
  return h("section", {},
    h("h2", {}, t("grantsTitle")), h("p", {}, t("grantsText")),
    proposal.map(grant => h("div", { className: "grant" },
      h("h3", {}, roleOf(grant.root.id), grant.operations.every(op => has(grant.root.id, op)) ? h("span", { className: "badge" }, t("granted")) : null),
      h("div", { className: "ops" }, grant.operations.map(op => h("label", {},
        h("input", { type: "checkbox", checked: true, on: { change: event => { event.target.checked ? selected.get(grant.root.id).add(op) : selected.get(grant.root.id).delete(op); } } }), op))))),
    h("button", { disabled: busy, on: { click: async () => {
      busy = true; message = { kind: "warn", text: t("granting") }; render();
      const grants = [...selected.entries()].map(([root, ops]) => ({ root, operations: [...ops] }));
      const result = await api("POST", "/api/grants", { grants });
      busy = false;
      message = result.ok ? null : { kind: "bad", text: errorText(result) };
      refresh();
    } } }, t("grant")));
}

function doneCard() {
  const locations = (state.layout || {}).locations || [];
  const prefs = state.preferences || {};
  const edit = { workingLanguage: prefs.workingLanguage || lang, timezone: prefs.timezone || "" };
  return h("section", {},
    h("h2", {}, t("doneTitle")), h("p", {}, t("doneText")),
    h("label", {}, t("locations")),
    h("ul", { className: "plain" }, locations.map(location => h("li", {}, `${TEXT[lang].roles[location.role]}: `, h("span", { className: location.status === "ok" ? "badge" : "msg bad" }, location.status), ` — ${location.detail}`))),
    h("div", { className: "grid" },
      h("div", {}, h("label", { htmlFor: "pw" }, t("working")),
        h("select", { id: "pw", on: { change: event => { edit.workingLanguage = event.target.value; } } }, [["en", "English"], ["zh-CN", "中文"]].map(([value, label]) => h("option", { value, selected: edit.workingLanguage === value }, label)))),
      h("div", {}, h("label", { htmlFor: "pt" }, t("timezone")),
        h("input", { type: "text", id: "pt", value: edit.timezone, placeholder: t("timezoneHint"), on: { input: event => { edit.timezone = event.target.value; } } }))),
    h("button", { disabled: busy, on: { click: async () => {
      busy = true; render();
      const result = await api("POST", "/api/preferences", { workingLanguage: edit.workingLanguage, timezone: edit.timezone.trim() || null });
      busy = false;
      message = result.ok || (result.error && /alters nothing|no change|nothing/i.test(result.error.message)) ? { kind: "ok", text: t("saved") } : { kind: "bad", text: errorText(result) };
      refresh();
    } } }, t("save")));
}

refresh();
</script>
</body>
</html>
