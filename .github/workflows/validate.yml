name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm dist
      # Generated output belongs in ignored dist/; building must not rewrite source.
      - name: Build must leave tracked source unchanged
        run: git diff --exit-code
      - run: git diff --check
